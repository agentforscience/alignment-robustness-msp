[project]
name = "research-workspace"
version = "0.1.0"
description = "Research workspace for experiments"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.14.0",
    "arxiv>=4.0.1",
    "bitsandbytes>=0.50.0",
    "datasets>=5.0.1",
    "easy-dataset-share>=0.5.0",
    "httpx>=0.28.1",
    "huggingface-hub>=1.27.0",
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
    "peft>=0.20.0",
    "pypdf>=6.15.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scipy>=1.15.3",
    "statsmodels>=0.14.6",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "trl>=1.9.2",
]

[tool.uv]
package = false
